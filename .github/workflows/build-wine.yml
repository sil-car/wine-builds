name: Build & release wine
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The wine version to build; e.g. 9.19"
        required: true
        type: string

env:
  WINE_VER: ${{ inputs.version }}
  RELEASE_NAME: wine_${{ inputs.version }}
  # CC: "gcc-9"
  # CXX: "g++-9"
  # CROSSCC_X32: "i686-w64-mingw32-gcc"
  # CROSSCXX_X32: "i686-w64-mingw32-g++"
  # CROSSCC_X64: "x86_64-w64-mingw32-gcc"
  # CROSSCXX_X64: "x86_64-w64-mingw32-g++"
  CFLAGS: "-march=x86-64 -msse3 -mfpmath=sse -O2 -ftree-vectorize"  # host (x86_64 unix)
  CXXFLAGS: "-march=x86-64 -msse3 -mfpmath=sse -O2 -ftree-vectorize"
  i386_CFLAGS: "-march=x86-64 -msse2 -mfpmath=sse -O2 -ftree-vectorize"
  i386_CXXFLAGS: "-march=x86-64 -msse2 -mfpmath=sse -O2 -ftree-vectorize"
  x86_64_CFLAGS: "-march=x86-64 -msse3 -mfpmath=sse -O2 -ftree-vectorize"
  x86_64_CXXFLAGS: "-march=x86-64 -msse3 -mfpmath=sse -O2 -ftree-vectorize"
  LDFLAGS: "-Wl,-O1,--sort-common,--as-needed"
  CROSSLDFLAGS: "-Wl,-O1,--sort-common,--as-needed"
  WINE_CONFIG: "--without-capi --without-coreaudio --without-gphoto --without-gssapi --without-inotify --without-krb5 --without-oss --without-pcap --without-pcsclite --without-sane --disable-winemenubuilder --disable-win16 --disable-tests --enable-archs=i386,x86_64"
  DEV_PKGS: "libavcodec-dev libcups2-dev libdbus-1-dev libfontconfig-dev libfreetype6-dev libgcrypt20-dev gettext libgettextpo-dev libgnutls28-dev libgstreamer-plugins-base1.0-dev libjxr-dev liblcms2-dev opencl-headers libopengl-dev libpulse-dev libudev-dev libunwind-dev libusb-1.0-0-dev libv4l-dev libvulkan-dev libwayland-bin libwayland-dev libxcb-xkb-dev libxcomposite-dev libxcursor-dev libxi-dev libxkbregistry-dev libxpresent-dev libxrandr-dev"
  # FOCAL_MISSING_PKGS: "libxkbregistry-dev"
  BUILD_PKGS: "bison flex g++ g++-mingw-w64 gcc gcc-mingw-w64 pkgconf"
  # PKG_CONFIG_PATH: "/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

jobs:
  build:
    strategy:
      matrix:
        release: [22.04, 24.04, 26.04]
    runs-on: ubuntu-${{ matrix.release }}
    steps:
      - name: get wine source
        uses: actions/checkout@v4
        with:
          repository: wine-mirror/wine
          ref: wine-${{ env.WINE_VER }}
          fetch-depth: 1
      - name: wine-prep
        id: wine-prep
        run: |
          echo "RELEASE_FILE=$RELEASE_NAME+${{ matrix.release }}.tar.xz" >> "$GITHUB_ENV"
          echo WINE_OUTPUT_DIR=$GITHUB_WORKSPACE/$RELEASE_NAME >> "$GITHUB_ENV"
          echo MAKEFLAGS="-j$(($(nproc) + 1))" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get --yes install $BUILD_PKGS $DEV_PKGS
      - name: build wine
        id: wine
        run: |
          mkdir -p build && cd build
          $GITHUB_WORKSPACE/configure $WINE_CONFIG --prefix=$WINE_OUTPUT_DIR
          make && make install-lib
          find $WINE_OUTPUT_DIR -type f | sort > $GITHUB_WORKSPACE/filelist.log
      - name: Upload logs
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.release }}
          path: '**/*.log'
          retention-days: 2
      - name: Clean up release files
        run: |
          rm -rf "$WINE_OUTPUT_DIR/share/man"
          # rm -f "$WINE_OUTPUT_DIR/bin/wine-preloader"
          ln -sf wine "$WINE_OUTPUT_DIR/bin/wine64"
          cd $GITHUB_WORKSPACE
          XZ_OPT=-T0 tar -C "$GITHUB_WORKSPACE" -cJf "$RELEASE_FILE" "$RELEASE_NAME"
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FILE }}
          path: ${{ env.RELEASE_FILE }}
          compression-level: 0

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - name: download
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ env.RELEASE_NAME }}*.tar.xz
        merge-multiple: true
    - name: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_NAME }}
        draft: true
        files: ${{ env.RELEASE_NAME }}*.tar.xz
